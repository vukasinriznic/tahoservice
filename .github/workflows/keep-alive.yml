name: Keep Alive

on:
  schedule:
    # 06:00-20:55 UTC = 08:00-22:55 po nasem vremenu (leti). Prozor je uzak
    # namerno: sva tri Render servisa dele 750h mesecno, a jedan budan 24/7
    # potrosi ceo taj budzet. ~15h dnevno staje u ~456h.
    - cron: '*/5 6-20 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping TahoService
        run: curl -sSf --retry 3 --retry-all-errors --max-time 120 https://tahoservice.onrender.com/health > /dev/null
